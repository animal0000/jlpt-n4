  .round-btn {

  .badge {

  .badge-num { background: #F8FAFC; border: 1px solid #CBD5E1; color: #0F172A; }

  }

  }

  }

ion": "listening", "section_label": "청해 (듣기)", "mondai": "문제 4 (즉각 응답)", "q_num": 28, "answer": 1, "crop_img": "crops/vol2/listening_q28.png", "audio_clip": "audio_clips/vol2/listening_q28.mp3", "is_instant_response": true}];

let state = {
  activeRound: 'all',
  activeTab: 'all',
  answers: JSON.parse(localStorage.getItem('jlpt_n4_user_answers') || '{}')
};

function saveState() {
  localStorage.setItem('jlpt_n4_user_answers', JSON.stringify(state.answers));
}

function updateScore() {
  const currentFiltered = getFilteredQuestions(true);
  const total = currentFiltered.length;
  let solved = 0;
  let correct = 0;
  let wrong = 0;

  QUESTIONS.forEach(q => {
    const userA = state.answers[q.id];
    if (userA !== undefined) {
      if (userA === q.answer) correct++;
      else wrong++;
    }
  });

  currentFiltered.forEach(q => {
    if (state.answers[q.id] !== undefined) solved++;
  });

  document.getElementById('totalCountPill').innerText = `선택 회차: ${total}문항`;
  document.getElementById('solvedPill').innerText = `풀이: ${solved}/${total}`;
  document.getElementById('scorePill').innerText = `정답: ${correct}`;
  document.getElementById('ratePill').innerText = `정답률: ${solved > 0 ? Math.round((correct/solved)*100) : 0}%`;
  document.getElementById('wrongCount').innerText = wrong;
}

function getFilteredQuestions(forStatsOnly = false) {
  return QUESTIONS.filter(q => {
    if (state.activeRound !== 'all' && q.vol !== parseInt(state.activeRound)) return false;
    if (forStatsOnly) return true;
    if (state.activeTab === 'all') return true;
    if (state.activeTab === 'review') {
      const userA = state.answers[q.id];
      return userA !== undefined && userA !== q.answer;
    }
    return q.section === state.activeTab;
  });
}

function render() {
  updateScore();
  const listEl = document.getElementById('qList');
  listEl.innerHTML = '';

  const filtered = getFilteredQuestions();

  if (filtered.length === 0) {
    listEl.innerHTML = `
      <div style="text-align: center; padding: 48px 16px; background: #fff; border-radius: 16px; border: 1px dashed #CBD5E1;">
        <h3 style="margin: 0 0 8px; font-size: 18px; color: #475569;">표시할 문항이 없습니다.</h3>
        <p style="margin: 0; color: #94A3B8; font-size: 14px;">선택한 회차 또는 오답 복습 목록이 비어 있습니다.</p>
      </div>
    `;
    return;
  }

  filtered.forEach(q => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card_${q.id}`;

    const userAns = state.answers[q.id];

    let choiceBtns = '';
    const numChoices = q.is_instant_response ? 3 : 4;
    for (let c = 1; c <= numChoices; c++) {
      let btnClass = 'choice-btn';
      if (userAns !== undefined) {
        if (c === q.answer) btnClass += ' selected-correct';
        else if (c === userAns) btnClass += ' selected-wrong';
      }
      choiceBtns += `<button class="${btnClass}" onclick="handleSelect('${q.id}', ${c})">${c}</button>`;
    }

    let audioHtml = '';
    if (q.audio_clip) {
      audioHtml = `
        <div class="audio-box">
          <div style="font-weight: 800; font-size: 13px; color: var(--navy); margin-bottom: 4px;">
            🎧 문항 ${q.q_num}번 전용 음성 클립
          </div>
          <audio controls preload="none">
            <source src="${q.audio_clip}" type="audio/mp3">
            브라우저가 오디오 재생을 지원하지 않습니다.
          </audio>
          <div style="font-size: 11px; color: #64748B; margin-top: 4px;">※ 개별 문항 단위로 정밀 슬라이스된 MP3 클립입니다.</div>
        </div>
      `;
    }

    let visualContent = '';
    if (q.is_instant_response) {
      visualContent = `
        <div class="instant-box">
          🎙️ [즉각 응답] 음성을 듣고 가장 알맞은 대답(1, 2, 3)을 고르세요.
        </div>
      `;
    } else {
      visualContent = `
        <div class="crop-wrapper">
          <img src="${q.crop_img}?v=20261020_v2" alt="문항 ${q.q_num}번 이미지" loading="lazy">
        </div>
      `;
    }

    let resultBadge = '';
    if (userAns !== undefined) {
      if (userAns === q.answer) {
        resultBadge = '<span class="badge" style="background:#D1FAE5; color:#065F46;">⭕ 정답</span>';
      } else {
        resultBadge = '<span class="badge" style="background:#FEE2E2; color:#991B1B;">❌ 오답</span>';
      }
    }

    card.innerHTML = `
      <div class="card-meta">
        <div class="meta-left">
          <span class="badge badge-vol">${q.vol_label}</span>
          <span class="badge badge-sec">${q.section_label}</span>
          <span class="badge badge-num">${q.mondai} 문항 ${q.q_num}번</span>
        </div>
        <div>${resultBadge}</div>
      </div>

      ${audioHtml}
      ${visualContent}

      <div class="choice-box">
        ${choiceBtns}
      </div>

      <button class="toggle-exp-btn" onclick="toggleExp('${q.id}')">💡 정답 및 해설 보기</button>
      <div class="explanation-box" id="exp_${q.id}">
        <strong>정답: [ ${q.answer}번 ]</strong>
        <p style="margin: 6px 0 0; font-size: 13.5px;">공식 정답표 기준 정답 번호는 <strong>${q.answer}번</strong>입니다.</p>
      </div>
    `;

    listEl.appendChild(card);
  });
}

function handleSelect(qId, choice) {
  state.answers[qId] = choice;
  saveState();
  render();
}

function toggleExp(qId) {
  const el = document.getElementById(`exp_${qId}`);
  if (el) el.classList.toggle('show');
}

// Event Listeners
document.querySelectorAll('.round-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.round-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    state.activeRound = e.target.getAttribute('data-round');
    render();
  });
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    state.activeTab = e.target.getAttribute('data-tab');
    render();
  });
});

render();
</script>
