<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="JLPT N4 공식 기출 195제 마스터 허브 썸네일">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Crimson Red Title Gradient -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Traditional Japanese Lattice Pattern (Kumiko) -->
    <pattern id="lattice" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none"/>
      <path d="M 0 12 L 24 12 M 12 0 L 12 24 M 0 0 L 24 24 M 0 24 L 24 0" stroke="rgba(255,255,255,0.03)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="320" height="200" fill="url(#bgGrad)"/>
  <rect width="320" height="200" fill="url(#lattice)"/>

  <!-- Traditional Corner Borders -->
  <path d="M 12 28 L 12 12 L 28 12" stroke="#f43f5e" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M 308 28 L 308 12 L 292 12" stroke="#f43f5e" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M 12 172 L 12 188 L 28 188" stroke="#f43f5e" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M 308 172 L 308 188 L 292 188" stroke="#f43f5e" stroke-width="1.8" fill="none" opacity="0.7"/>

  <!-- Top Pill Badge -->
  <rect x="85" y="22" width="150" height="22" rx="11" fill="rgba(244, 63, 94, 0.15)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1"/>
  <text x="160" y="37" text-anchor="middle" font-family="'Pretendard', -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#fecdd3" letter-spacing="1">제1집·제2집 공식 195제</text>

  <!-- Main Title -->
  <text x="160" y="86" text-anchor="middle"
        font-family="'Pretendard', -apple-system, sans-serif"
        font-weight="900" font-size="34" fill="url(#redGrad)"
        letter-spacing="-0.5">JLPT N4</text>

  <!-- Sub Title -->
  <text x="160" y="118" text-anchor="middle"
        font-family="'Pretendard', -apple-system, sans-serif"
        font-weight="800" font-size="16" fill="#f8fafc"
        letter-spacing="1.5">195제 마스터 허브</text>

  <!-- Feature Pills -->
  <g transform="translate(36, 140)">
    <!-- Audio Pill -->
    <rect x="0" y="0" width="76" height="22" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <text x="38" y="15" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">🎧 개별 청해</text>

    <!-- Review Pill -->
    <rect x="84" y="0" width="76" height="22" rx="6" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="0.8"/>
    <text x="122" y="15" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#f87171">🔥 오답 복습</text>

    <!-- Explanations Pill -->
    <rect x="168" y="0" width="76" height="22" rx="6" fill="rgba(34, 197, 94, 0.12)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="0.8"/>
    <text x="206" y="15" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10" font-weight="700" fill="#4ade80">💡 심층 해설</text>
  </g>

  <!-- Japanese Traditional Red Stamp Seal -->
  <g transform="translate(268, 140)">
    <rect width="24" height="24" rx="4" fill="#be123c" stroke="#e11d48" stroke-width="1"/>
    <text x="12" y="16" text-anchor="middle" font-family="'Batang', 'Yu Mincho', serif" font-weight="900" font-size="11" fill="#fff" letter-spacing="-1">日語</text>
  </g>
</svg>
